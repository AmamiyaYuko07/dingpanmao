name: Build and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # 两个版本并行构建：
  #   framework  —— 体积小，需要用户自己装 .NET 10 桌面运行时
  #   standalone —— 免安装运行时，体积大
  build:
    name: Build (${{ matrix.label }})
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - label: framework
            self_contained: false
            asset_suffix: win-x64
          - label: standalone
            self_contained: true
            asset_suffix: win-x64-standalone

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore src/DingPanMao/DingPanMao.csproj

      - name: Build
        run: dotnet build src/DingPanMao/DingPanMao.csproj -c Release --no-restore --nologo

      - name: Publish
        run: >
          dotnet publish src/DingPanMao/DingPanMao.csproj
          -c Release -r win-x64
          --self-contained ${{ matrix.self_contained }}
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o dist --nologo

      - name: Package
        shell: pwsh
        run: |
          $label = if ('${{ github.ref_type }}' -eq 'tag') { '${{ github.ref_name }}' } else { 'latest' }
          $name = "DingPanMao-$label-${{ matrix.asset_suffix }}"
          Compress-Archive -Path dist/DingPanMao.exe -DestinationPath "$name.zip" -Force
          $size = [math]::Round((Get-Item "$name.zip").Length / 1KB, 1)
          Write-Host "打包完成: $name.zip ($size KB)"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DingPanMao-${{ matrix.asset_suffix }}
          path: '*.zip'
          if-no-files-found: error

  # 汇总两个版本的产物，统一发一次 Release，避免并发写同一个 release
  release:
    name: Publish release
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -lh artifacts

      # 打 tag（v1.0.0 这种）时发布正式 Release
      - name: Release (tag)
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
          generate_release_notes: true
          draft: false

      # 推到 main 时更新名为 latest 的预发布包
      - name: Release (latest)
        if: github.ref_type == 'branch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          prerelease: true
          files: artifacts/*.zip
          body: |
            由 main 分支最新提交自动构建，非正式版本。

            | 下载 | 说明 |
            |---|---|
            | `DingPanMao-latest-win-x64.zip` | 体积小（约 400 KB），需要先装 [.NET 10 桌面运行时](https://dotnet.microsoft.com/download/dotnet/10.0) |
            | `DingPanMao-latest-win-x64-standalone.zip` | 免安装运行时，解压即用，体积较大 |

            - Commit: `${{ github.sha }}`
